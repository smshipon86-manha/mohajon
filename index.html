<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>মহাজন ড্যাশবোর্ড - মেসার্স ধুনট সিড এন্ড এগ্রো ট্রেডার্স</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700&family=Hind+Siliguri:wght@400;500;600&display=swap" rel="stylesheet">
<style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:'Noto Sans Bengali','Hind Siliguri','Segoe UI',Arial,sans-serif; -webkit-tap-highlight-color:transparent; }
    html { -webkit-text-size-adjust:100%; }
    :root {
        --brand-950:#102a22; --brand-900:#173c30; --brand-800:#20523f;
        --brand-700:#2d6a4f; --brand-600:#3d8061; --brand-500:#55a078;
        --canvas:#f5f8f6; --line:#e2ece5;
    }
    body { background:var(--canvas); color:#1c2b23; padding-bottom:40px; overflow-x:hidden; }
    .header-top {
        background:linear-gradient(120deg,var(--brand-950) 0%,var(--brand-800) 45%,var(--brand-600) 100%);
        color:#fff; padding:22px 16px; border-bottom:4px solid #d4a017;
        box-shadow:0 4px 14px rgba(0,0,0,.25);
        display:flex; flex-direction:column; align-items:center; text-align:center; gap:10px;
    }
    .header-top img.logo { width:110px; height:auto; border-radius:14px; background:#fff; padding:6px; box-shadow:0 8px 20px rgba(0,0,0,.25); }
    .header-top h1 { font-size:clamp(17px,4.5vw,24px); line-height:1.3; }
    .header-top .distributor-line { font-size:12.5px; opacity:.95; font-weight:600; }
    .header-top .sub { font-size:13px; opacity:.92; }
    .header-top .today-date { font-size:12.5px; opacity:.95; background:rgba(255,255,255,.14); padding:4px 12px; border-radius:20px; }
    .header-top .updated { font-size:11.5px; opacity:.85; }
    .wrap { max-width:1000px; margin:0 auto; padding:18px 12px; }
    .cards-grid {
        display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
        gap:14px; margin-bottom:22px;
    }
    /* প্রতিটি কার্ডে তার নিজস্ব রঙের গ্রেডিয়েন্ট ব্যাকগ্রাউন্ড — আরো
       আকর্ষণীয়, উজ্জ্বল দেখানোর জন্য (আগে সাদা কার্ডে শুধু ছোট আইকন
       রঙিন ছিল, এখন পুরো কার্ডই রঙিন)। */
    .stat-card {
        background:linear-gradient(150deg, var(--card-color-a,#2d6a4f), var(--card-color-b,#1b4332));
        border-radius:18px; padding:18px 16px 16px; color:#fff;
        box-shadow:0 14px 28px -6px var(--card-shadow, rgba(20,52,42,.35));
        position:relative; overflow:hidden; transition:transform .18s ease, box-shadow .18s ease;
    }
    .stat-card::after {
        content:''; position:absolute; width:120px; height:120px; right:-42px; top:-42px;
        border-radius:50%; background:rgba(255,255,255,.16);
    }
    .stat-card::before {
        content:''; position:absolute; width:70px; height:70px; left:-26px; bottom:-30px;
        border-radius:50%; background:rgba(255,255,255,.10);
    }
    .stat-card.clickable { cursor:pointer; }
    .stat-card.clickable:active { transform:scale(0.97); }
    .stat-card.clickable:hover { transform:translateY(-3px); box-shadow:0 18px 34px -4px var(--card-shadow, rgba(20,52,42,.42)); }
    .stat-icon {
        width:44px; height:44px; border-radius:13px; display:flex; align-items:center; justify-content:center;
        font-size:21px; background:rgba(255,255,255,.24); color:#fff; margin-bottom:10px;
        position:relative; z-index:1; backdrop-filter:blur(2px);
    }
    .stat-label { font-size:12.5px; color:rgba(255,255,255,.9); font-weight:700; margin-bottom:4px; position:relative; z-index:1; }
    .stat-value { font-size:21px; font-weight:800; color:#fff; word-break:break-word; position:relative; z-index:1; text-shadow:0 2px 6px rgba(0,0,0,.12); }
    .stat-hint { font-size:11px; color:rgba(255,255,255,.85); margin-top:4px; position:relative; z-index:1; }

    .modal-overlay {
        display:none; position:fixed; inset:0; background:rgba(10,20,15,.55);
        z-index:2000; align-items:flex-start; justify-content:center; padding:0; overflow-y:auto;
    }
    .modal-overlay.show { display:flex; }
    .modal-box {
        background:#fff; border-radius:0; width:100%; max-width:900px; min-height:100vh;
        overflow-y:auto; padding:16px 12px 30px; box-shadow:0 24px 60px rgba(0,0,0,.3);
    }
    @media (min-width:640px) {
        .modal-overlay { padding:26px 12px; }
        .modal-box { border-radius:16px; min-height:0; max-height:92vh; padding:20px; }
    }
    .modal-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; position:sticky; top:0; background:#fff; padding-bottom:8px; z-index:1; }
    .modal-header h3 { color:var(--brand-900); font-size:17px; }
    .close-btn { cursor:pointer; font-size:30px; color:#888; line-height:1; padding:0 6px; }
    .close-btn:hover { color:#c0392b; }
    .due-search { width:100%; padding:12px 14px; border:1px solid var(--line); border-radius:10px; font-size:15px; margin-bottom:12px; }
    /* মোট বাকি + ডাউনলোড বাটন সবার আগে (তালিকার উপরে) দেখানো হয়, যাতে
       নিচে স্ক্রল করতে না হয়। */
    .due-total-bar {
        display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; flex-wrap:wrap; gap:10px;
        background:#f4f8f5; border:1px solid var(--line); border-radius:10px; padding:10px 14px;
    }
    /* বাকির তালিকা — সাধারণ রো-কলাম (টেবিল) আকারে। "ট্রেডার্সের নাম" ও
       "বাকি" কলাম দুটি সাইডে স্টিকি (আটকানো) রাখা হয়েছে, যাতে মোবাইলে
       পাশে স্ক্রল করলেও নাম আর বাকির টাকা সবসময় চোখে পড়ে — বাকি
       তথ্য (ঠিকানা/রুট/মোবাইল) দরকার হলে মাঝখানে স্ক্রল করে দেখা যাবে। */
    .due-table-wrap { border:1px solid var(--line); border-radius:10px; overflow:auto; max-height:60vh; -webkit-overflow-scrolling:touch; }
    table.due-table { width:100%; border-collapse:collapse; font-size:12.5px; }
    table.due-table th, table.due-table td { padding:9px 10px; border-bottom:1px solid #ececec; text-align:left; white-space:nowrap; }
    table.due-table tbody tr:last-child td { border-bottom:none; }
    table.due-table thead th { position:sticky; top:0; background:#f4f8f5; color:var(--brand-950); font-size:11.5px; z-index:2; }
    table.due-table .due-col-name { position:sticky; left:0; background:#fff; font-weight:700; color:var(--brand-950); max-width:150px; overflow:hidden; text-overflow:ellipsis; z-index:1; }
    table.due-table thead .due-col-name { background:#f4f8f5; z-index:3; }
    table.due-table .due-col-amount { position:sticky; right:0; background:#fff; font-weight:800; color:#c0392b; text-align:right; z-index:1; }
    table.due-table thead .due-col-amount { background:#f4f8f5; z-index:3; }
    table.due-table tbody tr.route-group-start td { border-top:3px solid var(--brand-500); }
    table.due-table .due-row-sno { color:#9aa8a1; font-weight:600; margin-right:4px; }
    .btn { border:0; border-radius:10px; padding:12px 20px; font-weight:700; font-size:14px; cursor:pointer; color:#fff; width:100%; }
    @media (min-width:480px) { .btn { width:auto; } }
    .btn-download { background:var(--brand-700); }
    .btn-download:hover { background:var(--brand-800); }
    .loading, .empty-msg { text-align:center; padding:30px; color:#8a9a91; }
    .error-banner {
        background:#fdecea; border:1px solid #c0392b; color:#c0392b; padding:14px 16px;
        border-radius:12px; margin-bottom:18px; font-size:14px; font-weight:600;
    }
</style>

                            <th>মোবাইল</th>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script>
    // এই ফাইলটা সম্পূর্ণ read-only — এটা শুধু "sales_system/mohajonView"
    // নামের একটামাত্র সারাংশ ডকুমেন্ট থেকে তথ্য পড়ে, কোনো লগইন লাগে না।
    // মূল অ্যাপের appData/invoices/retailers এখানে কখনো সরাসরি আসে না —
    // তাই এই লিংক যদি কারও হাতে চলেও যায়, শুধু এই সারাংশ তথ্যটুকুই দেখা
    // যাবে, ব্যবসার পুরো ডাটাবেজ (পণ্যের ক্রয়মূল্য, সব কাস্টমারের বিস্তারিত
    // ইতিহাস ইত্যাদি) কখনো উন্মুক্ত হবে না।
    const firebaseConfig = {
        apiKey: "AIzaSyBcpEzIN18lkFQJOchwXK4OERLe58va9Yw",
        authDomain: "shipon-6e337.firebaseapp.com",
        projectId: "shipon-6e337",
        storageBucket: "shipon-6e337.firebasestorage.app",
        messagingSenderId: "680199241257",
        appId: "1:680199241257:web:1c79d5c20b3cd553582638",
        measurementId: "G-Y67ZTBK9JD"
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let latestData = null;

    function toBanglaNumber(value) {
        const digits = ['০','১','২','৩','৪','৫','৬','৭','৮','৯'];
        return String(value).replace(/[0-9]/g, d => digits[Number(d)]);
    }
    function money(v) {
        return toBanglaNumber(Math.round(Number(v || 0)).toLocaleString('en-US')) + ' ৳';
    }
    function escapeHtml(s) {
        return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }
    function displayTraderName(name) {
        return String(name || '');
    }

    // হেডারে আজকের তারিখ ও বার (দিনের নাম) — এটা লাইভ ডাটার উপর নির্ভর
    // করে না, তাই পেজ লোড হওয়ার সাথে সাথেই দেখানো হয়।
    function renderTodayDate() {
        try {
            const text = new Date().toLocaleDateString('bn-BD', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
            document.getElementById('todayDateBar').innerText = text;
        } catch (e) {
            document.getElementById('todayDateBar').innerText = new Date().toLocaleDateString();
        }
    }
    renderTodayDate();

    db.collection('sales_system').doc('mohajonView').onSnapshot((doc) => {
        document.getElementById('errorBanner').innerHTML = '';
        if (!doc.exists) {
            document.getElementById('cardsGrid').innerHTML = '<div class="empty-msg">এখনো কোনো তথ্য প্রকাশ করা হয়নি। মূল সিস্টেমে একবার কোনো তথ্য সেভ/সিঙ্ক হলে এখানে দেখা যাবে।</div>';
            return;
        }
        latestData = doc.data();
        renderCards();
        if (document.getElementById('dueModal').classList.contains('show')) renderDueTable();
    }, (error) => {
        console.error('Mohajon view read error:', error);
        document.getElementById('errorBanner').innerHTML = '<div class="error-banner">⚠️ তথ্য লোড করা যায়নি। ইন্টারনেট সংযোগ পরীক্ষা করুন, অথবা কিছুক্ষণ পর আবার চেষ্টা করুন।</div>';
    });

    function renderCards() {
        const d = latestData || {};
        const updatedAt = d.updatedAt && d.updatedAt.toDate ? d.updatedAt.toDate() : null;
        document.getElementById('lastUpdated').innerText = updatedAt
            ? `সর্বশেষ হালনাগাদ: ${updatedAt.toLocaleString('bn-BD')}`
            : 'সর্বশেষ হালনাগাদের সময় জানা যায়নি';

        // মহাজনের জন্য শুধু ৪টি সবচেয়ে জরুরি কার্ড — বেশি কার্ড থাকলে
        // ড্যাশবোর্ড ভারী/এলোমেলো লাগে, তাই মাসিক হিসাবের কার্ডগুলো বাদ
        // দিয়ে শুধু দৈনিক + সার্বিক তথ্য রাখা হয়েছে। প্রতিটি কার্ডের জন্য
        // দুটো রঙ (গ্রেডিয়েন্ট) — আরো উজ্জ্বল, আকর্ষণীয় দেখানোর জন্য।
        const cards = [
            { colorA:'#22c55e', colorB:'#15803d', shadow:'rgba(21,128,61,.38)', icon:'📅', label:'আজকের বিক্রি', value: money(d.todaySales) },
            { colorA:'#0ea5e9', colorB:'#0369a1', shadow:'rgba(3,105,161,.38)', icon:'✅', label:'আজকের মোট কালেকশন', value: money(d.todayCollection) },
            { colorA:'#f59e0b', colorB:'#b45309', shadow:'rgba(180,83,9,.38)', icon:'📦', label:'মোট স্টকের মূল্য', value: money(d.totalStockValue) },
            { colorA:'#f43f5e', colorB:'#be123c', shadow:'rgba(190,18,60,.4)', icon:'⚠️', label:'মোট বাকি', value: money(d.totalDue), clickable:true, hint:'তালিকা দেখতে ট্যাপ করুন' }
        ];
        document.getElementById('cardsGrid').innerHTML = cards.map(c => `
            <div class="stat-card ${c.clickable ? 'clickable' : ''}" style="--card-color-a:${c.colorA};--card-color-b:${c.colorB};--card-shadow:${c.shadow}" ${c.clickable ? 'onclick="openDueModal()"' : ''}>
                <div class="stat-icon">${c.icon}</div>
                <div class="stat-label">${c.label}</div>
                <div class="stat-value">${c.value}</div>
                ${c.hint ? `<div class="stat-hint">${c.hint}</div>` : ''}
            </div>
        `).join('');
    }

    function openDueModal() {
        document.getElementById('dueModal').classList.add('show');
        document.getElementById('dueSearchInput').value = '';
        renderDueTable();
        document.body.style.overflow = 'hidden';
    }
    function closeDueModal() {
        document.getElementById('dueModal').classList.remove('show');
        document.body.style.overflow = '';
    }

    // dueList মূল অ্যাপ থেকেই আগে থেকে রুট অনুযায়ী গ্রুপ করে (routes
    // অ্যারের ক্রম অনুযায়ী, তারপর নাম অনুযায়ী) সাজানো অবস্থায় আসে —
    // তাই এখানে আলাদা করে আবার সাজানোর দরকার নেই, সেই ক্রমই বজায় রাখা
    // হয়েছে, শুধু সার্চ থাকলে ফিল্টার করা হয়।
    function renderDueTable() {
        const d = latestData || {};
        const list = Array.isArray(d.dueList) ? d.dueList : [];
        const query = (document.getElementById('dueSearchInput').value || '').trim().toLowerCase();
        const filtered = list.filter(r => {
            if (!query) return true;
            return String(r.trader||'').toLowerCase().includes(query)
                || String(r.name||'').toLowerCase().includes(query)
                || String(r.route||'').toLowerCase().includes(query)
                || String(r.address||'').toLowerCase().includes(query)
                || String(r.mobile||'').toLowerCase().includes(query);
        });
        let total = 0;
        let lastRoute = null;
        const rowsHtml = filtered.map((r, i) => {
            total += Number(r.due||0)||0;
            // শুধু ব্যক্তির নাম দেখানো হয় (ট্রেডার্স/দোকানের নাম বাদে); যদি
            // ব্যক্তির নাম সেভ না থাকে তখনই ট্রেডার্স নামটা fallback হিসেবে
            // দেখানো হয়, যাতে ঘরটা কখনো খালি না থাকে।
            const personLabel = r.name ? displayTraderName(r.name) : displayTraderName(r.trader);
            const isNewRouteGroup = query === '' && r.route !== lastRoute;
            lastRoute = r.route;
            return `<tr class="${isNewRouteGroup && i > 0 ? 'route-group-start' : ''}">
                <td class="due-col-name"><span class="due-row-sno">${toBanglaNumber(i+1)}.</span>${escapeHtml(personLabel)}</td>
                <td>${escapeHtml(r.address||'—')}</td>
                <td>${escapeHtml(r.mobile||'')}</td>
                <td class="due-col-amount">${money(r.due)}</td>
            </tr>`;
        }).join('');
        document.getElementById('dueTableBody').innerHTML = rowsHtml || '<tr><td colspan="4" style="text-align:center;color:#888;padding:24px;">কোনো রেকর্ড পাওয়া যায়নি।</td></tr>';
        document.getElementById('dueTotalText').innerText = `মোট বাকি (${toBanglaNumber(filtered.length)} জন): ${money(total)}`;
        window.__currentDueRows = filtered;
    }

    function downloadDueCSV() {
        // স্ক্রিনে যে ক্রমে (রুট অনুযায়ী গ্রুপ করে) দেখানো হচ্ছে, ডাউনলোডেও
        // ঠিক একই ক্রম বজায় থাকে — এলোমেলো হয় না।
        const rows = window.__currentDueRows || [];
        const lines = [
            ['কার কাছে কত টাকা বাকি'],
            ['তারিখ', new Date().toLocaleString('bn-BD')],
            [],
            ['ক্রম','নাম','ঠিকানা','মোবাইল','বাকি']
        ];
        rows.forEach((r, i) => lines.push([i+1, (r.name || r.trader || ''), r.address||'', r.mobile||'', r.due||0]));
        lines.push([]);
        lines.push(['সর্বমোট', '', '', '', rows.reduce((s,r)=>s+(Number(r.due||0)||0),0)]);
        const csv = '﻿' + lines.map(row => row.map(v => `"${String(v ?? '').replace(/"/g,'""')}"`).join(',')).join('\n');
        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([csv], {type:'text/csv;charset=utf-8;'}));
        a.download = `mohajon-due-list-${new Date().toISOString().slice(0,10)}.csv`;
        a.click();
        setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    }
</script>
</body>
</html>
